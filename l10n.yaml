# Configuration for `flutter gen-l10n`. Run automatically on `flutter pub get`
# and `flutter run` because pubspec.yaml has `flutter.generate: true`.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
output-dir: lib/l10n/generated
