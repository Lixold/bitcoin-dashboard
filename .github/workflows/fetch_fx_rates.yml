name: Fetch ECB FX rates

# Daily at 16:23 UTC. The ECB publishes the eurofxref-daily feed around
# 16:00 CET on TARGET2 banking days, i.e. 15:00 UTC in summer (CEST) and
# 14:00 UTC in winter (CET). 16:23 UTC is therefore comfortably after
# publish year-round, with a small buffer for delayed updates.
#
# Off-beat minute (:23 instead of :00/:15/:30/:45) avoids the global
# GitHub Actions cron spike — those round-quarter marks are heavily
# congested and routinely drop scheduled runs.
#
# On weekends / ECB holidays the feed still serves the previous day's
# rates — the daily run is a no-op upgrade in that case (same content
# re-uploaded), which is intentional and cheaper than special-casing.
on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

# Read-only token — this workflow does not push back to the repository.
permissions:
  contents: read

# Avoid overlapping runs in case a manual dispatch lands on the cron tick.
concurrency:
  group: fetch-fx-rates
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch & upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships a recent Python 3 on PATH as `python3`; we skip
      # actions/setup-python for the same reasons documented in
      # fetch_history.yml (fewer deps, no allowlist changes).
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests boto3

      - name: Run fetch_fx_rates.py
        env:
          # Cloudflare R2 credentials — see ADR-003.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Make `from utils.* import ...` work when the script is run
          # from the repo root. PYTHONPATH=scripts puts the package on
          # sys.path.
          PYTHONPATH: scripts
        run: python3 scripts/fetch_fx_rates.py
