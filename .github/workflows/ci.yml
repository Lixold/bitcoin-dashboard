name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Reusable Flutter setup — referenced by all jobs that need the SDK.
# ---------------------------------------------------------------------------
env:
  FLUTTER_VERSION: '3.41.9'
  FLUTTER_CHANNEL: 'stable'

jobs:

  # -------------------------------------------------------------------------
  # 1. Format gate
  #    Fast (~10 s) first check: rejects unformatted code before heavier jobs.
  #    Contributors must run `dart format .` locally before pushing.
  # -------------------------------------------------------------------------
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  # -------------------------------------------------------------------------
  # 2. Static analysis + Riverpod lint
  #    Runs analysis_options.yaml (strict-casts, strict-inference, custom_lint).
  #    Includes Riverpod-specific provider misuse detection.
  # -------------------------------------------------------------------------
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # -------------------------------------------------------------------------
  # 3. Tests + Coverage
  #    Generates lcov coverage report. No upload to external services
  #    (privacy-first principle). Summary is printed to the job log.
  # -------------------------------------------------------------------------
  test:
    name: Flutter Test & Coverage
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Print coverage summary
        # Quote $GITHUB_STEP_SUMMARY (shellcheck SC2086) and collapse the
        # four append redirects into a single brace block (SC2129) so the
        # step is actionlint-clean.
        run: |
          lcov --summary coverage/lcov.info 2>&1 | tee coverage_summary.txt
          {
            echo "### Test Coverage"
            echo '```'
            cat coverage_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 4. Build verification (all release targets — audit finding #12)
  #    Compile-only check across every release platform so a platform-specific
  #    regression (Info.plist drift, Gradle bump, missing Pod, kaputter
  #    Runner.rc) is caught at PR time instead of at first release.
  #
  #    Build flags by target:
  #      * Desktop (linux/windows/macos): --release exercises tree-shaking
  #        and strip steps that --debug skips.
  #      * Android: --debug, because a release APK needs a signing keystore
  #        that does not belong in a PR gate. The signed-release pipeline
  #        will live in a separate workflow with secrets.
  #      * iOS: --release --no-codesign, because there is no Apple
  #        Developer cert in CI yet. Verifies the Xcode build graph and
  #        Pod resolution without signing.
  # -------------------------------------------------------------------------
  build:
    name: Flutter Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: analyze
    # fail-fast: false — if iOS fails we still want to know whether Android
    # built; the platforms are independent regressions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            build: flutter build linux --release
          - target: windows
            os: windows-latest
            build: flutter build windows --release
          - target: macos
            os: macos-latest
            build: flutter build macos --release
          - target: android
            os: ubuntu-latest
            build: flutter build apk --debug
          - target: ios
            os: macos-latest
            build: flutter build ios --release --no-codesign
    steps:
      - uses: actions/checkout@v4

      # Android needs JDK 17 for the modern Gradle 8 / AGP 8 toolchain.
      # The other targets either don't need a JDK or ship Xcode's bundled JDK.
      - name: Setup Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # GTK + clang + cmake + ninja are needed for the Linux desktop
      # embedder. Windows ships MSBuild / Visual Studio Build Tools on the
      # runner image; macOS ships the full Xcode toolchain. So only Linux
      # has an explicit apt step.
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Desktop targets are gated by a per-project flag in Flutter's
      # config. iOS and Android are enabled by default.
      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos'
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build }}

  # -------------------------------------------------------------------------
  # 5. Dependency review (PRs only)
  #    GitHub-native action: diffs newly introduced dependencies against the
  #    GitHub Advisory Database. No external service — runs entirely on GitHub.
  #    Blocks merge if a newly added package has a known vulnerability.
  #
  #    Note: an earlier `dart pub audit` job was removed because no such
  #    subcommand exists in the Dart SDK (verified against Dart 3.11.5).
  #    GitHub's Advisory Database covers the same CVE feed for newly added
  #    dependencies on PRs, which is the only path through which a vulnerable
  #    package can enter this repo.
  # -------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
          fail-on-severity: moderate

  # -------------------------------------------------------------------------
  # 7. Workers lint + dry-run bundle (audit finding #5)
  #    `node --check` catches JS syntax errors; `wrangler deploy --dry-run`
  #    additionally validates wrangler.toml, resolves imports against the
  #    shared _shared/ modules, and produces the deployment bundle without
  #    talking to the Cloudflare API. No CLOUDFLARE_API_TOKEN required.
  # -------------------------------------------------------------------------
  workers:
    name: Workers Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - cron-history
          - cron-fx-rates
          - cron-network-stats
          - cron-news-en
          - cron-news-de
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install workers dependencies
        # Only runs if workers/package.json exists (introduced for finding
        # #7). The `--prefer-offline` keeps cold installs fast on CI.
        run: |
          if [ -f workers/package.json ]; then
            npm --prefix workers ci --prefer-offline --no-audit --no-fund
          fi

      - name: node --check on Worker entrypoint
        run: node --check "workers/${{ matrix.worker }}/src/index.js"

      - name: node --check on shared modules
        run: |
          for f in workers/_shared/*.js; do
            node --check "$f"
          done

      - name: wrangler deploy --dry-run
        # Bundles the Worker against its wrangler.toml without performing
        # any remote API call. Surfaces import errors, malformed config,
        # and missing bindings before deploy time.
        working-directory: workers/${{ matrix.worker }}
        run: npx -y wrangler@4 deploy --dry-run --outdir /tmp/bundle

  # -------------------------------------------------------------------------
  # 8. Workers unit tests (audit finding #4 – first slice)
  #    Runs the Node-native test runner against the shared modules and the
  #    per-Worker pure functions (parseEcbXml, aggregateHealth, trendLabel,
  #    parseFeed, …). Independent of the matrix job above so the same
  #    test suite runs exactly once.
  # -------------------------------------------------------------------------
  workers-test:
    name: Workers Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install workers dependencies
        run: npm --prefix workers ci --prefer-offline --no-audit --no-fund

      - name: Run tests
        run: npm --prefix workers test
