name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Reusable Flutter setup — referenced by all jobs that need the SDK.
# ---------------------------------------------------------------------------
env:
  FLUTTER_VERSION: '3.41.9'
  FLUTTER_CHANNEL: 'stable'

jobs:

  # -------------------------------------------------------------------------
  # 1. Format gate
  #    Fast (~10 s) first check: rejects unformatted code before heavier jobs.
  #    Contributors must run `dart format .` locally before pushing.
  # -------------------------------------------------------------------------
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  # -------------------------------------------------------------------------
  # 2. Static analysis + Riverpod lint
  #    Runs analysis_options.yaml (strict-casts, strict-inference, custom_lint).
  #    Includes Riverpod-specific provider misuse detection.
  # -------------------------------------------------------------------------
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # -------------------------------------------------------------------------
  # 3. Tests + Coverage
  #    Generates lcov coverage report. No upload to external services
  #    (privacy-first principle). Summary is printed to the job log.
  # -------------------------------------------------------------------------
  test:
    name: Flutter Test & Coverage
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Print coverage summary
        run: |
          lcov --summary coverage/lcov.info 2>&1 | tee coverage_summary.txt
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------------
  # 4. Build verification (Linux desktop)
  #    Confirms the app compiles end-to-end — `flutter analyze` passing does
  #    not guarantee a successful release build (codegen, asset pipeline, etc.)
  # -------------------------------------------------------------------------
  build:
    name: Flutter Build (Linux)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

  # -------------------------------------------------------------------------
  # 5. Dependency review (PRs only)
  #    GitHub-native action: diffs newly introduced dependencies against the
  #    GitHub Advisory Database. No external service — runs entirely on GitHub.
  #    Blocks merge if a newly added package has a known vulnerability.
  #
  #    Note: an earlier `dart pub audit` job was removed because no such
  #    subcommand exists in the Dart SDK (verified against Dart 3.11.5).
  #    GitHub's Advisory Database covers the same CVE feed for newly added
  #    dependencies on PRs, which is the only path through which a vulnerable
  #    package can enter this repo.
  # -------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
          fail-on-severity: moderate
