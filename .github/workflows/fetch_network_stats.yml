name: Fetch Bitcoin network health

# Daily at 01:13 UTC. The off-beat minute (:13 instead of :00) avoids
# the global GitHub Actions cron spike that hits every round-quarter
# mark — same rationale as fetch_history.yml and fetch_fx_rates.yml.
# This matters even more for daily crons than for the 15-min ones:
# a single missed slot here means a 24h data gap, not a 15-min one.
on:
  schedule:
    - cron: "13 1 * * *"
  workflow_dispatch:

# Read-only token — this workflow does not push back to the repository.
permissions:
  contents: read

# Avoid overlapping runs in case a manual dispatch lands on the cron tick.
concurrency:
  group: fetch-network-stats
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch & upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships a recent Python 3 on PATH as `python3`;
      # we skip actions/setup-python for the same reasons documented
      # in fetch_history.yml. No new dependencies beyond the shared
      # `requests` (HTTP) and `boto3` (R2 upload) — this script uses
      # only stdlib + utils on top of those.
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests boto3

      - name: Run fetch_network_stats.py
        env:
          # Cloudflare R2 credentials — see ADR-003.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Make `from utils.* import ...` work when the script is run
          # from the repo root. PYTHONPATH=scripts puts the package on
          # sys.path.
          PYTHONPATH: scripts
        run: python3 scripts/fetch_network_stats.py
