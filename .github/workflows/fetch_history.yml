name: Fetch Bitcoin history & market data

# Runs every 15 minutes (and on demand) to refresh the static JSON files
# served via the CDN. See `scripts/fetch_history.py` for the data layout.
#
# Off-beat schedule (xx:07/22/37/52 instead of xx:00/15/30/45) avoids the
# global GitHub Actions cron spike. `schedule` is best-effort on GitHub:
# millions of workflows fire on the round-quarter marks simultaneously
# and many get queued or dropped during the spike. A +7 min offset rides
# the trough and significantly improves real-world hit rate.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Read-only token — this workflow does not push back to the repository.
permissions:
  contents: read

# Avoid overlapping runs if a previous fetch is still uploading when the
# next cron tick fires (rare but cheap insurance).
concurrency:
  group: fetch-history
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch & upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships a recent Python 3 (3.12 on 24.04) on PATH as
      # `python3`, so we skip actions/setup-python entirely — fewer
      # dependencies and no need to extend the repository's Actions
      # allowlist. Specific minor versions (e.g. 3.11) live in the
      # hostedtoolcache but are not on PATH without setup-python.
      # Our code uses `from __future__ import annotations` and is
      # compatible with any 3.10+, so the runner default is fine.
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests boto3

      - name: Run fetch_history.py
        env:
          # Cloudflare R2 credentials — see ADR-003.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Optional: raises CoinGecko Demo API rate limit.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Make `from utils.* import ...` work when the script is run from
          # the repo root. PYTHONPATH=scripts puts the package on sys.path.
          PYTHONPATH: scripts
        run: python3 scripts/fetch_history.py
