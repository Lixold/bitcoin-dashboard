name: Bug
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, platform, app version or commit.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [app, worker, ci, docs]
    validations:
      required: true
