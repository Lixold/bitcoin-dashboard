name: bitcoin_dashboard
description: "Privacy-first Bitcoin dashboard for live price, on-chain data, news and prognoses."
publish_to: 'none'

# version: <semver>+<build-number>. Bump together with platform release metadata.
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (ADR-004) — classic API, no codegen needed for the MVP.
  # Codegen (riverpod_annotation + riverpod_generator) can be added later.
  flutter_riverpod: ^3.3.1

  # Networking
  dio: ^5.9.2

  # Local cache / settings (key-value + JSON)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts (ADR — fl_chart MIT)
  fl_chart: ^1.2.0

  # i18n / number formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Riverpod analyzer plugin (catches common provider misuse).
  # custom_lint is pulled in transitively.
  riverpod_lint: ^3.1.3

flutter:
  uses-material-design: true
  generate: true                # enables flutter gen-l10n via l10n.yaml
