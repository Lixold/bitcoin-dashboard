<!DOCTYPE html>
<html>
<head>
  <!--
    Base href is rewritten by `flutter build web` from the --base-href flag.
    Leave the placeholder untouched in source.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Privacy-first Bitcoin dashboard — live price, on-chain data, news and prognoses. No login, no tracking, open source.">
  <meta name="theme-color" content="#F7931A">
  <meta name="color-scheme" content="light dark">

  <!-- PWA / iOS web-app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitcoin Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Bitcoin Dashboard</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
