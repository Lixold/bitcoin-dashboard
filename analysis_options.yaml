# Static analysis configuration. Surfaced in IDEs and via `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat unawaited futures and missing return cases as build-failing.
    unawaited_futures: error
    missing_return: error
    invalid_annotation_target: ignore   # Riverpod-/JSON-codegen friendliness
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - "build/**"
  plugins:
    - custom_lint

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
    sort_pub_dependencies: false   # we group by purpose, not alphabetically
