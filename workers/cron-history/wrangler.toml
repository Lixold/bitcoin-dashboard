name = "bitcoin-dashboard-cron-history"
main = "src/index.js"
compatibility_date = "2026-05-12"

# Disable the public *.workers.dev URL and per-deploy preview URLs — these
# Workers expose only a `scheduled` handler, so a public route would just
# leak the cron topology without serving anything useful.
workers_dev = false
preview_urls = false

# CoinGecko price history (1D/1W/1M/3M/1Y) + market snapshot. All ranges fan
# out via Promise.all and are written to data/history-*.json + data/market.json.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bitcoin-dashboard-data"

[triggers]
crons = ["*/15 * * * *"]

# Workers Observability — sample 100 % of invocations. Volume is tiny
# (~96/day per 15-min Worker) so full sampling has no cost concern, and
# the per-source isolation logs are only useful if we can actually read
# them in the CF dashboard.
[observability]
enabled = true
head_sampling_rate = 1
