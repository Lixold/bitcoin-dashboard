name = "bitcoin-dashboard-cron-network-stats"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Disable the public *.workers.dev URL and per-deploy preview URLs — these
# Workers expose only a `scheduled` handler, so a public route would just
# leak the cron topology without serving anything useful.
workers_dev = false
preview_urls = false

# Bitcoin network-health (Bitnodes + Mempool.space) -> data/network-health.json.
# Daily snapshot at 01:00 UTC. Per-source isolation: ship partial payload if
# one upstream fails; only abort when both fail.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bitcoin-dashboard-data"

[triggers]
crons = ["0 1 * * *"]

# Workers Observability — sample 100 % of invocations. The Worker fires
# once per day; full sampling is essentially free and lets us diagnose
# Bitnodes/Mempool regressions from the CF dashboard.
[observability]
enabled = true
head_sampling_rate = 1
